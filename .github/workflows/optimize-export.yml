name: Optimize site after upload

# When a new Claude Design export is uploaded to main, re-apply the speed,
# phone and language fixes (tools/optimize_export.py) and publish again.
on:
  push:
    branches: [main]
    paths: ['index.html', 'support.js', 'assets/photos/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-export
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/optimize_export.py
      - name: Commit the optimized page
        id: commit
        run: |
          git add -A index.html assets/photos
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-apply speed, phone and language fixes to the uploaded page"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push"
